name: Build SUSFS for YAAP

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, or auto for UTC date plus run number
        required: false
        default: auto
        type: string
      publish_release:
        description: Publish the YAAP SUSFS module and tools to a release
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-susfs-yaap-${{ github.ref }}
  cancel-in-progress: false

env:
  ARCH: arm64
  KERNEL_REPO: https://github.com/AkiHaza/android_kernel_oneplus_sm8650.git
  KERNEL_REF: seventeen
  MODULES_REPO: https://github.com/AkiHaza/android_kernel_oneplus_sm8650-modules.git
  MODULES_REF: seventeen
  TOOLCHAIN_URL: https://github.com/AkiHaza/Floran-Kernel/releases/download/toolchain-r596125/linux-x86-refs_heads_android17-release-clang-r596125.tar.gz

jobs:
  build:
    name: Build SUSFS for YAAP seventeen
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout SUSFS source
        uses: actions/checkout@v6

      - name: Setup swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libdw-dev libelf-dev libncurses-dev libssl-dev pahole \
            binutils cpio kmod lz4 rsync python3 git jq unzip xz-utils zip

      - name: Download YAAP clang-r596125
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/toolchain"
          curl --fail --location --retry 5 --retry-all-errors \
            "$TOOLCHAIN_URL" -o "$RUNNER_TEMP/clang.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$RUNNER_TEMP/toolchain"
          clang_bin="$(find "$RUNNER_TEMP/toolchain" -path '*/bin/clang' \
            \( -type f -o -type l \) -print -quit)"
          test -n "$clang_bin" -a -x "$clang_bin"
          clang_dir="$(dirname "$clang_bin")"
          echo "$clang_dir" >> "$GITHUB_PATH"
          echo "CLANG_BIN=$clang_dir" >> "$GITHUB_ENV"
          "$clang_bin" --version

      - name: Resolve release metadata
        id: metadata
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euxo pipefail
          if [ -z "$REQUESTED_TAG" ] || [ "$REQUESTED_TAG" = auto ]; then
            tag="$(date -u +%F)-${GITHUB_RUN_NUMBER}"
          else
            tag="$REQUESTED_TAG"
          fi
          case "$tag" in
            *[!A-Za-z0-9._-]*)
              echo "Invalid release tag: $tag" >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Clone latest YAAP kernel and modules
        env:
          KERNEL_DIR: ${{ runner.temp }}/sm8650
          MODULES_DIR: ${{ runner.temp }}/sm8650-modules
        run: |
          set -euxo pipefail
          clone_latest() {
            local repo="$1" ref="$2" dir="$3" expected_sha
            expected_sha="$(git ls-remote --exit-code "$repo" \
              "refs/heads/$ref" | awk 'NR == 1 { print $1 }')"
            test -n "$expected_sha"
            git clone --filter=blob:none --no-tags --depth=1 \
              --single-branch --branch "$ref" "$repo" "$dir"
            test "$(git -C "$dir" rev-parse HEAD)" = "$expected_sha"
          }

          clone_latest "$KERNEL_REPO" "$KERNEL_REF" "$KERNEL_DIR"
          clone_latest "$MODULES_REPO" "$MODULES_REF" "$MODULES_DIR"

          touchpanel_link="$KERNEL_DIR/drivers/base/touchpanel_notify"
          test -L "$touchpanel_link"
          test "$(readlink "$touchpanel_link")" = \
            "../../../sm8650-modules/oplus/kernel/touchpanel/touchpanel_notify"
          test -f "$touchpanel_link/Kconfig"
          test -f "$touchpanel_link/Makefile"

          kernel_commit="$(git -C "$KERNEL_DIR" rev-parse HEAD)"
          modules_commit="$(git -C "$MODULES_DIR" rev-parse HEAD)"
          {
            echo "KERNEL_DIR=$KERNEL_DIR"
            echo "MODULES_DIR=$MODULES_DIR"
            echo "KERNEL_COMMIT=$kernel_commit"
            echo "MODULES_COMMIT=$modules_commit"
          } >> "$GITHUB_ENV"
          {
            echo "### YAAP source revisions"
            echo "- kernel ($KERNEL_REF): \`$kernel_commit\`"
            echo "- modules ($MODULES_REF): \`$modules_commit\`"
            echo "- touchpanel source: \`$(readlink "$touchpanel_link")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare YAAP kernel configuration
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path(os.environ["KERNEL_DIR"]) / "certs/extract-cert.c"
          text = path.read_text()
          guarded_decl = """#ifdef USE_PKCS11_ENGINE
          static const char *key_pass;
          #endif"""
          guarded_assignment = """#ifdef USE_PKCS11_ENGINE
          \tkey_pass = getenv("KBUILD_SIGN_PIN");
          #endif"""
          declaration = "static const char *key_pass;"
          assignment = '\tkey_pass = getenv("KBUILD_SIGN_PIN");'

          if guarded_decl in text and guarded_assignment in text:
              text = text.replace(guarded_decl, declaration, 1)
              text = text.replace(guarded_assignment, assignment, 1)
              path.write_text(text)
          elif not (guarded_decl in text or guarded_assignment in text) \
                  and declaration in text and assignment in text:
              pass
          else:
              raise SystemExit("Unsupported extract-cert.c key_pass layout")
          PY
          echo 'Applied YAAP extract-cert key_pass compatibility fix.' \
            >> "$GITHUB_STEP_SUMMARY"

          mkdir -p "$RUNNER_TEMP/yaap-out"
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 gki_defconfig
          KCONFIG_CONFIG="$RUNNER_TEMP/yaap-out/.config" \
            "$KERNEL_DIR/scripts/kconfig/merge_config.sh" -m -r -y \
            "$RUNNER_TEMP/yaap-out/.config" \
            "$KERNEL_DIR/arch/arm64/configs/vendor/pineapple_GKI.config" \
            "$KERNEL_DIR/arch/arm64/configs/vendor/oplus/pineapple_GKI.config"
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 olddefconfig

          for symbol in KPROBES KRETPROBES MODULES MODULE_UNLOAD KALLSYMS KALLSYMS_ALL MODVERSIONS CFI_CLANG HAVE_SYSCALL_TRACEPOINTS TRACEPOINTS SECURITY SECURITY_SELINUX PROC_FS; do
            grep -q "^CONFIG_${symbol}=y$" \
              "$RUNNER_TEMP/yaap-out/.config" || {
                echo "CONFIG_${symbol}=y is required by SUSFS" >&2
                exit 1
              }
          done
          if grep -q '^CONFIG_TRIM_UNUSED_KSYMS=y$' \
              "$RUNNER_TEMP/yaap-out/.config"; then
            echo 'CONFIG_TRIM_UNUSED_KSYMS=y can remove SUSFS imports' >&2
            exit 1
          fi
          if grep -q '^CONFIG_MODULE_SIG_FORCE=y$' \
              "$RUNNER_TEMP/yaap-out/.config"; then
            echo 'Unsigned external modules cannot load with CONFIG_MODULE_SIG_FORCE=y' \
              >&2
            exit 1
          fi
          if grep -q '^CONFIG_MODULE_SIG_ALL=y$' \
              "$RUNNER_TEMP/yaap-out/.config"; then
            echo 'CONFIG_MODULE_SIG_ALL=y signs modules with a CI-only key' >&2
            echo 'Build with the device kernel signing key before distributing modules.' \
              >&2
            exit 1
          fi
          grep -E '^(CONFIG_(KPROBES|KALLSYMS|KALLSYMS_ALL|MODULES|MODULE_UNLOAD|MODVERSIONS|MODULE_SIG|MODULE_SIG_ALL|MODULE_SIG_FORCE|MODULE_SIG_PROTECT|TRIM_UNUSED_KSYMS|CFI_CLANG|LTO_CLANG_THIN|DEBUG_INFO_BTF))=' \
            "$RUNNER_TEMP/yaap-out/.config" | tee "$RUNNER_TEMP/yaap-config.txt"

      - name: Build YAAP kernel symbols
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image modules
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 modules_prepare
          test -s "$RUNNER_TEMP/yaap-out/Module.symvers"
          test -s "$RUNNER_TEMP/yaap-out/vmlinux"
          test -s "$RUNNER_TEMP/yaap-out/include/config/kernel.release"
          test -s "$RUNNER_TEMP/yaap-out/include/config/auto.conf"
          grep -q '^CONFIG_MODVERSIONS=y$' "$RUNNER_TEMP/yaap-out/.config"

      - name: Build SUSFS against YAAP
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          # Unexported imports are resolved by susfs_insmod/ksud; do not alter CRCs.
          make -C "$KERNEL_DIR" O="$RUNNER_TEMP/yaap-out" ARCH="$ARCH" \
            LLVM=1 LLVM_IAS=1 M="$GITHUB_WORKSPACE/kernel" \
            src="$GITHUB_WORKSPACE/kernel" KBUILD_MODPOST_WARN=1 modules
          test -s "$GITHUB_WORKSPACE/kernel/susfs_guard_lkm.ko"
          test -s "$RUNNER_TEMP/yaap-out/System.map"

      - name: Mandatory YAAP symbol and CFI gates
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          ko="$GITHUB_WORKSPACE/kernel/susfs_guard_lkm.ko"
          llvm-nm --undefined-only "$ko" > "$RUNNER_TEMP/undefined-nm.txt"
          awk '{print $NF}' "$RUNNER_TEMP/undefined-nm.txt" | sort -u \
            > "$RUNNER_TEMP/undefined-symbols.txt"
          test -s "$RUNNER_TEMP/undefined-symbols.txt"
          if grep -q '^kallsyms_' "$RUNNER_TEMP/undefined-symbols.txt"; then
            echo '::error::kallsyms_* must be bootstrapped, never imported' >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          available = {line.split()[-1] for line in
                       (root / 'yaap-out/System.map').read_text().splitlines() if line.strip()}
          imports = set((root / 'undefined-symbols.txt').read_text().splitlines())
          required = {'show_vfsmnt', 'show_mountinfo', 'show_vfsstat',
                      'show_map_vma', 'show_smap', 'security_hook_heads',
                      'kallsyms_lookup_name', 'kallsyms_lookup', 'kallsyms_on_each_symbol'}
          missing = sorted((imports | required) - available)
          if missing:
              raise SystemExit('Required YAAP symbols missing: ' + ', '.join(missing))
          print(f'All {len(imports)} imports and runtime hook/bootstrap symbols exist in System.map')
          PY
          python3 tools/cfi_sites.py \
            --allow init_module,susfs_layers_down,susfs_tw_func "$ko"

      - name: Build freestanding userspace tools
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          mkdir -p "$RUNNER_TEMP/package/tools"
          for tool in susfs_sc susfs_bench susfs_mmap susfs_memrd susfs_mntid susfs_insmod; do
            clang --target=aarch64-linux-gnu -O2 -nostdlib -static-pie \
              -fno-stack-protector -fno-builtin -fuse-ld=lld -Wl,-e,_start \
              -o "$RUNNER_TEMP/package/tools/$tool" "tools/$tool.c"
            llvm-readelf -h "$RUNNER_TEMP/package/tools/$tool" | grep 'Machine:.*AArch64'
          done
          clang --target=armv7a-linux-androideabi -march=armv7-a -O2 -nostdlib \
            -static-pie -fno-stack-protector -fno-builtin -fuse-ld=lld \
            -Wl,-e,_start -o "$RUNNER_TEMP/package/tools/susfs_compat_stat" \
            tools/susfs_compat_stat.c
          llvm-readelf -h "$RUNNER_TEMP/package/tools/susfs_compat_stat" | grep 'Machine:.*ARM'

      - name: Validate module metadata before and after stripping
        run: |
          set -euxo pipefail
          export PATH="$CLANG_BIN:$PATH"
          cp kernel/susfs_guard_lkm.ko "$RUNNER_TEMP/package/susfs_guard_lkm.ko"
          for stage in before after; do
            if [ "$stage" = after ]; then
              llvm-strip --strip-debug "$RUNNER_TEMP/package/susfs_guard_lkm.ko"
            fi
            python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          ko = str(root / 'package/susfs_guard_lkm.ko')
          def run(*args):
              return subprocess.check_output(args, text=True).strip()
          if 'AArch64' not in run('llvm-readelf', '-h', ko):
              raise SystemExit('Module is not AArch64')
          release = (root / 'yaap-out/include/config/kernel.release').read_text().strip()
          vermagic = run('modinfo', '-F', 'vermagic', ko)
          if vermagic.split()[0] != release or 'modversions' not in vermagic.split():
              raise SystemExit('Missing modversions or kernel release mismatch: ' + vermagic)
          # Parse the actual section, rather than accepting a section heading alone.
          from importlib.util import spec_from_file_location, module_from_spec
          spec = spec_from_file_location('cfi_sites', 'tools/cfi_sites.py')
          cfi = module_from_spec(spec)
          spec.loader.exec_module(cfi)
          elf = cfi.Ko(ko)
          section = next((s for s in elf.secs if s['sname'] == '__versions'), None)
          if section is None or section['size'] == 0:
              raise SystemExit('Empty/missing __versions')
          symvers = {}
          for line in (root / 'yaap-out/Module.symvers').read_text().splitlines():
              fields = line.split()
              if len(fields) >= 2:
                  symvers[fields[1]] = int(fields[0], 16)
          versions = {}
          for line in run('modprobe', '--show-modversions', ko).splitlines():
              fields = line.split()
              if len(fields) == 2:
                  versions[fields[1]] = int(fields[0], 16)
          if not versions or not versions.get('module_layout'):
              raise SystemExit('Missing/zero module_layout CRC')
          if versions['module_layout'] != symvers.get('module_layout'):
              raise SystemExit('module_layout CRC does not match YAAP Module.symvers')
          for name, crc in versions.items():
              if name not in symvers or symvers[name] != crc:
                  raise SystemExit(f'{name} CRC does not match YAAP Module.symvers')
          namespace = 'VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver'
          if namespace not in run('modinfo', '-F', 'import_ns', ko).splitlines():
              raise SystemExit('Required VFS namespace import was lost')
          if run('modinfo', '-F', 'signer', ko):
              raise SystemExit('Unexpected module signing key')
          print(f'{vermagic}; __versions={section["size"]}; {len(versions)} matching CRCs')
          PY
            python3 tools/cfi_sites.py \
              --allow init_module,susfs_layers_down,susfs_tw_func \
              "$RUNNER_TEMP/package/susfs_guard_lkm.ko"
          done
          modinfo "$RUNNER_TEMP/package/susfs_guard_lkm.ko" \
            > "$RUNNER_TEMP/package/susfs_guard_lkm.ko.modinfo"
          modprobe --show-modversions "$RUNNER_TEMP/package/susfs_guard_lkm.ko" \
            > "$RUNNER_TEMP/package/module-versions.txt"

      - name: Package YAAP SUSFS build
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euxo pipefail
          package="$RUNNER_TEMP/package"
          cp tools/verify-gki.sh "$package/tools/"
          cp PROC_INTERFACES.md "$package/"
          cp "$RUNNER_TEMP/yaap-out/.config" "$package/yaap.config"
          cp "$RUNNER_TEMP/yaap-config.txt" "$package/yaap-config.txt"
          cp "$RUNNER_TEMP/undefined-symbols.txt" "$package/"
          kernel_release="$(cat "$RUNNER_TEMP/yaap-out/include/config/kernel.release")"
          {
            echo "YAAP SUSFS build: $RELEASE_TAG"
            echo "Module source: $GITHUB_SHA"
            echo "Kernel release: $kernel_release"
            echo "Kernel ($KERNEL_REF): $KERNEL_COMMIT"
            echo "Modules ($MODULES_REF): $MODULES_COMMIT"
            echo "Toolchain: $TOOLCHAIN_URL"
            echo "Compiler: $($CLANG_BIN/clang --version | head -1)"
            echo
            echo 'Requires the exact matching YAAP kernel/configuration and a privileged loader.'
            echo 'The module retains real YAAP modversion CRCs and its VFS namespace import.'
            echo 'Unexported symbols require tools/susfs_insmod or a compatible ksud loader.'
            echo 'Build/static gates passed; device loading and runtime behavior have NOT been tested.'
            echo 'Use tools/verify-gki.sh on the matching device for runtime verification.'
          } > "$package/README.txt"
          cp "$package/README.txt" "$RUNNER_TEMP/release-notes.md"
          (cd "$package" && find . -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -czf "$RUNNER_TEMP/susfs-yaap-seventeen-$RELEASE_TAG.tar.gz" -C "$package" .
          (cd "$RUNNER_TEMP" && sha256sum "susfs-yaap-seventeen-$RELEASE_TAG.tar.gz" \
            > susfs-yaap-seventeen-tarball.sha256)
          cat "$package/README.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload YAAP SUSFS artifact
        uses: actions/upload-artifact@v4
        with:
          name: susfs-yaap-seventeen-${{ steps.metadata.outputs.tag }}
          path: |
            ${{ runner.temp }}/package
            ${{ runner.temp }}/susfs-yaap-seventeen-*.tar.gz
            ${{ runner.temp }}/susfs-yaap-seventeen-tarball.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish YAAP SUSFS release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: SUSFS YAAP ${{ steps.metadata.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            ${{ runner.temp }}/susfs-yaap-seventeen-*.tar.gz
            ${{ runner.temp }}/susfs-yaap-seventeen-tarball.sha256
          fail_on_unmatched_files: true
